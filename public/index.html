<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><!-- 医疗资料页面不进搜索引擎 -->
<title>小葡宝 GraPal · GTN 工作台 v0.9.1</title>
<!-- 内联 favicon：file:// 静态打开不给 favicon.ico 会在控制台留一条 404 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237b5ea7'/%3E%3Ctext x='16' y='23' font-size='19' font-family='PingFang SC,Helvetica,sans-serif' font-weight='700' fill='%23fff' text-anchor='middle'%3E%E8%91%A1%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="shell.css"><!-- 开发版外壳（分栏/五态/横幅），原型视觉基准仍是 style.css -->
<link rel="stylesheet" href="primer.css"><!-- 36 号疾病概要（整页四段），样式独立于 style.css -->
</head>
<body>
<a class="skip" href="#main">跳到主要内容</a>
<div class="prototype-bar"><span><b>开发版 v0.9.1</b> · 数据来自本机资料目录（演示档案为模拟资料）</span><span>由交互原型逐字符移植（基准 v0.9） · 刷新不清库</span></div>
<div class="workspace">
  <aside class="sidebar" id="sidebar" aria-label="小葡宝业务导航">
    <div class="brand"><div><strong>小葡宝</strong><span>GraPal · GTN 病程整理</span></div></div>
    <nav id="nav" aria-label="一级导航"></nav>
    <div class="sidebar-bottom"><span class="eyebrow">小 X 宝家族</span><p>数值自己看，<br>判断留给医生。</p></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <div class="work-area">
    <header class="topbar">
      <button class="menu-btn" id="menu-btn" aria-label="打开导航菜单">☰</button>
      <div class="breadcrumb">小葡宝工作台 <span>/</span> <b id="breadcrumb">看板</b></div>
      <div class="top-actions">
        <button class="status" id="store-status" data-action="open-store" aria-label="资料目录状态：已连接"><i></i><span>资料目录</span><b>已连接</b></button>
        <button class="status" id="agent-toggle" data-action="agent-toggle" aria-expanded="false" aria-controls="agent-dock" aria-label="AI 对话：暂不可用（点击查看原因）"><i class="grey"></i><span>AI 对话</span><b id="agent-label">暂不可用</b></button>
        <button class="brief-btn" data-primer-open aria-label="疾病概要：定义、医学资料与指南情况、治疗全景、发展趋势" title="疾病概要：定义 · 指南 · 治疗全景 · 趋势">?</button>
        <button data-action="go-settings" aria-label="打开设置：资料目录、解析模式、临床参考数据包">⚙ 设置</button>
      </div>
    </header>
    <div class="data-banner" id="data-banner" data-level="info" hidden></div>
    <div class="work-grid" id="work-grid">
      <main id="main" tabindex="-1"></main>
      <div class="agent-splitter" id="agent-splitter" role="separator" aria-orientation="vertical" aria-label="调整 AI 对话面板宽度（左右方向键步进，Home/End 到边界）" aria-valuemin="25" aria-valuemax="45" aria-valuenow="35" tabindex="0" hidden></div>
      <aside class="agent-dock" id="agent-dock" aria-label="AI 对话面板" hidden>
        <div class="agent-head">
          <b>AI 对话</b><span class="muted" id="agent-note" style="font-size:12.5px;color:var(--muted)"></span>
          <span class="spacer"></span>
          <button class="icon-button" id="agent-hide" data-action="agent-hide" aria-label="收起 AI 对话面板" title="收起">×</button>
        </div>
        <div class="agent-body" id="agent-body"></div>
      </aside>
    </div>
    <footer class="footer">小葡宝 · 与妊娠滋养细胞肿瘤患者和照护者一起整理、理解、准备沟通 <span class="ver-line"><b id="app-version">v0.9.1</b><em id="app-build">2026-10-25</em></span></footer>
  </div>
</div>
<dialog id="dialog" aria-labelledby="dialog-title">
  <div class="dialog-head"><div><span class="eyebrow" id="dialog-eyebrow">小葡宝</span><h2 id="dialog-title"></h2></div><button class="icon-button" data-action="close" aria-label="关闭弹窗">×</button></div>
  <div id="dialog-body" class="dialog-body"></div>
  <div id="dialog-foot" class="dialog-foot"></div>
</dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="demo-data.js"></script>
<script src="primer-data.js"></script>
<script src="app.js"></script>
<script src="primer.js"></script>
</body></html>
